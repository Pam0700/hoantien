<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển Đổi Link Shopee</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
    <h1 class="text-2xl font-bold text-orange-600 text-center mb-2">Shopee Link Converter</h1>
    <p class="text-xs text-slate-500 text-center mb-6">Chuyển link Shopee thường thành Link Affiliate</p>

    <div class="space-y-4">
      <textarea id="urlInput" rows="3" placeholder="Dán link Shopee tại đây..." 
        class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>

      <button id="submitBtn" onclick="convertLink()" 
        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition">
        Tạo Link Affiliate
      </button>
    </div>

    <div id="resultBox" class="mt-6 hidden">
      <hr class="mb-4">
      <label class="block text-sm font-medium text-slate-700 mb-1">Link Affiliate rút gọn:</label>
      <div class="flex gap-2">
        <input id="resultInput" type="text" readonly 
          class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-orange-600 focus:outline-none">
        <button onclick="copyLink()" class="bg-slate-800 text-white px-4 rounded-xl text-sm font-medium">Copy</button>
      </div>
      <p id="copyAlert" class="text-xs text-green-600 mt-1 hidden">✓ Đã sao chép link!</p>
    </div>

    <div id="errorBox" class="mt-4 p-3 bg-red-50 text-red-600 text-sm rounded-xl hidden"></div>
  </div>

  <script>
    // URL Backend trên Render (sẽ thay ở BƯỚC 3)
    let BACKEND_URL = "URL_RENDER_CỦA_BẠN/api/convert";

    async function convertLink() {
      const url = document.getElementById('urlInput').value.trim();
      const btn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('resultBox');
      const errorBox = document.getElementById('errorBox');

      if (!url) return alert('Vui lòng dán link Shopee!');

      btn.disabled = true;
      btn.innerText = 'Đang tạo link (chờ 10-20s)...';
      resultBox.classList.add('hidden');
      errorBox.classList.add('hidden');

      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('resultInput').value = data.affLink;
          resultBox.classList.remove('hidden');
        } else {
          errorBox.innerText = data.error || 'Lỗi không xác định!';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.innerText = 'Lỗi kết nối tới Server! (Server có thể đang khởi động)';
        errorBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Tạo Link Affiliate';
      }
    }

    function copyLink() {
      const input = document.getElementById('resultInput');
      input.select();
      navigator.clipboard.writeText(input.value);
      const alertMsg = document.getElementById('copyAlert');
      alertMsg.classList.remove('hidden');
      setTimeout(() => alertMsg.classList.add('hidden'), 2000);
    }
  </script>
</body>
</html>
